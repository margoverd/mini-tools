<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мои Инструменты</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f3f3;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }

      header {
        margin-top: 40px;
        margin-bottom: 30px;
        text-align: center;
      }

      header h1 {
        margin: 0;
        font-size: 28px;
        color: #222;
      }

      header p {
        margin: 5px 0 0 0;
        font-size: 14px;
        color: #666;
      }

      .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        max-width: 900px;
        width: 100%;
        padding: 20px;
        box-sizing: border-box;
      }

      .tool-card {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        padding: 25px 15px;
        text-align: center;
        text-decoration: none;
        color: inherit;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .tool-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      }

      .tool-card:active {
        transform: translateY(-2px);
      }

      .icon-wrapper {
        width: 60px;
        height: 60px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 15px;
        color: white;
      }

      .tool-name {
        font-size: 15px;
        font-weight: bold;
        color: #333;
      }

      .bg-text {
        background: #ff9500;
      }
      .bg-todo {
        background: #34c759;
      }
      .bg-picker {
        background: #2fa7d6;
      }
      .bg-progress {
        background: #5856d6;
      }
      .bg-mood {
        background: linear-gradient(135deg, #2b6cb0, #4299e1);
      }

      svg {
        width: 32px;
        height: 32px;
        fill: currentColor;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Мини Инструменты</h1>
    </header>

    <div class="grid-container">
      <a href="./proverka-teksta/index.html" class="tool-card">
        <div class="icon-wrapper bg-text">
          <svg viewBox="0 0 24 24">
            <path
              d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"
            />
          </svg>
        </div>
        <div class="tool-name">Проверка текста</div>
      </a>

      <a href="./todo/index.html" class="tool-card">
        <div class="icon-wrapper bg-todo">
          <svg viewBox="0 0 24 24">
            <path
              d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"
            />
          </svg>
        </div>
        <div class="tool-name">To-Do Список</div>
      </a>

      <a href="./Pixel-Color-Picker/index.html" class="tool-card">
        <div class="icon-wrapper bg-picker">
          <svg viewBox="0 0 24 24">
            <path
              d="M17.66 5.41l.92.92-2.69 2.69-.92-.92 2.69-2.69M11 15.66l-.92-.92 6.58-6.58.92.92L11 15.66m-1.88.9l-.22-.22 6.58-6.58.22.22-6.58 6.58M20.71 5.63l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-3.12 3.12-1.93-1.93-1.41 1.41 1.42 1.42L3 16.25V21h4.75l8.92-8.92 1.42 1.42 1.41-1.41-1.92-1.92 3.13-3.12c.4-.4.4-1.03 0-1.42z"

      <a href="./progress-in-days/index.html" class="tool-card">

        <div class="tool-name">QR Code Stylist</div>
      </a>

      <a href="./article-writing-template/index.html" class="tool-card">
        <div
          class="icon-wrapper"
          style="background: linear-gradient(135deg, #7000ff, #007aff)"
        >
          <svg viewBox="0 0 24 24">
            <path
              d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"
            />
          </svg>

      <a href="./food-tracker/index.html" class="tool-card">

      <a href="./mood-tracker/index.html" class="tool-card">

      <a href="./mockup-animation/index.html" class="tool-card">
        <div class="icon-wrapper bg-mood">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
            <polygon points="10 8 16 12 10 16 10 8" fill="currentColor" />
          </svg>
        </div>
        <div class="tool-name">Mockup Animation</div>
      </a>

      <a href="./theory-learning/index.html" class="tool-card">
        <div class="icon-wrapper bg-mood">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C1.4 11.3 1 12.1 1 13v3c0 .6.4 1 1 1h2"
            />
            <circle cx="7" cy="17" r="2" />
            <circle cx="17" cy="17" r="2" />
          </svg>
        </div>
        <div class="tool-name">Theory Learning</div>
      </a>

      <a href="./calisthenics/index.html" class="tool-card">
        <div class="icon-wrapper bg-mood">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"

            <!-- Иконка гантели / фитнеса -->
            <path d="M14.4 14.4 9.6 9.6" />

            <path d="M19.8 11 21 9.8a2.83 2.83 0 0 0-4-4l-1.2 1.2" />

    </div>
  </body>
</html>
