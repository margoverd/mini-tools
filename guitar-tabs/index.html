<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TabPlayer — Минималистичный плеер таб</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.3.0/dist/alphaTab.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div class="header-container">
        <h1>TabPlayer</h1>
        <label class="upload-btn">
          Открыть GP файл
          <input type="file" id="fileInput" accept=".gp,.gp3,.gp4,.gp5,.gpx" />
        </label>
      </div>
    </header>

    <main class="app-main">
      <div id="statusMessage" class="status-message">
        Выберите файл .gp5 или .gpx для начала работы
      </div>

      <section class="controls-panel fixed-controls">
        <div class="control-group">
          <button id="playPauseBtn" class="btn btn-primary" disabled>
            Play
          </button>
          <button id="stopBtn" class="btn" disabled>Stop</button>
        </div>

        <div class="control-group tempo-group">
          <span class="label">Темп:</span>
          <input
            type="range"
            id="tempoRange"
            min="50"
            max="200"
            value="100"
            disabled
          />
          <span id="tempoValue">100%</span>
        </div>

        <div class="control-group">
          <span class="label">Дорожка:</span>
          <select id="trackSelect" class="select-input" disabled>
            <option>Файл не загружен</option>
          </select>
        </div>
      </section>

      <section class="viewport-container">
        <div id="alphaTab"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
