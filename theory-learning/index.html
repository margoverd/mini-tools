<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Теория вождения - Карточки</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg-front: #1e293b;
        --card-bg-back: #334155;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --accent-color: #38bdf8;
        --accent-hover: #0284c7;
        --shadow:
          0 20px 25px -5px rgba(0, 0, 0, 0.4),
          0 8px 10px -6px rgba(0, 0, 0, 0.3);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 20px;
        overflow: hidden;
      }

      header {
        text-align: center;
        margin-top: 10px;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--accent-color);
        margin-bottom: 5px;
      }

      .counter {
        font-size: 0.9rem;
        color: var(--text-muted);
      }

      .card-container {
        width: 100%;
        max-width: 380px;
        height: 440px;
        perspective: 1000px;
        position: relative;
        margin: 20px 0;
        touch-action: pan-y;
      }

      .card {
        width: 100%;
        height: 100%;
        position: absolute;
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        cursor: pointer;
        border-radius: 20px;
        box-shadow: var(--shadow);
      }

      .card.flipped {
        transform: rotateY(180deg);
      }

      .card-face {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 20px;
        padding: 30px 25px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .card-front {
        background-color: var(--card-bg-front);
        color: var(--text-main);
      }

      .card-back {
        background-color: var(--card-bg-back);
        color: var(--text-main);
        transform: rotateY(180deg);
      }

      .badge {
        position: absolute;
        top: 20px;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--accent-color);
        font-weight: 600;
      }

      .question {
        font-size: 1.35rem;
        font-weight: 600;
        line-height: 1.4;
      }

      .answer {
        font-size: 1.05rem;
        line-height: 1.6;
        color: #e2e8f0;
      }

      .hint {
        position: absolute;
        bottom: 20px;
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .controls {
        display: flex;
        gap: 15px;
        width: 100%;
        max-width: 380px;
        justify-content: center;
        margin-bottom: 10px;
      }

      .btn {
        background-color: var(--card-bg-front);
        color: var(--text-main);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 12px 20px;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn:active {
        transform: scale(0.95);
      }

      .btn-accent {
        background-color: var(--accent-color);
        color: var(--bg-color);
        border: none;
      }

      .btn-accent:hover {
        background-color: var(--accent-hover);
      }

      /* Swipe animations */
      .swipe-left {
        animation: swipeLeft 0.3s forwards ease-out;
      }

      .swipe-right {
        animation: swipeRight 0.3s forwards ease-out;
      }

      @keyframes swipeLeft {
        to {
          transform: translateX(-120%) rotate(-10deg);
          opacity: 0;
        }
      }

      @keyframes swipeRight {
        to {
          transform: translateX(120%) rotate(10deg);
          opacity: 0;
        }
      }

      @media (max-height: 600px) {
        .card-container {
          height: 320px;
        }
        .question {
          font-size: 1.15rem;
        }
        .answer {
          font-size: 0.95rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Auto Teorija</h1>
      <div class="counter" id="counter">1 / 14</div>
    </header>

    <div class="card-container" id="cardContainer">
      <div class="card" id="card">
        <div class="card-face card-front">
          <span class="badge">Вопрос</span>
          <div class="question" id="questionText"></div>
        </div>
        <div class="card-face card-back">
          <span class="badge">Ответ</span>
          <div class="answer" id="answerText"></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="prevBtn">←</button>
      <button class="btn btn-accent" id="shuffleBtn">Перемешать</button>
      <button class="btn" id="nextBtn">→</button>
    </div>

    <script>
      const flashcardsData = [
        {
          question: "Ziemas un vasaras riepas",
          answer:
            'Ziemas riepām uz sāna ir sniegpārsliņa, sniegavīrs vai uzraksts "WINTER". Ziemas riepām protektors ir ar sīkiem griezumiem. Ziemā protektora dziļumam jābūt vismaz 4 mm, vasarā — vismaz 1,6 mm. Mazāks dziļums izraisa sānslīdi un akvaplanēšanu.',
        },
        {
          question: "Gaisa spiediens riepās",
          answer:
            "Spiedienu mēra ar manometru. Parasti priekšējās riepās vajag aptuveni 2,2 atmosfēras, bet aizmugurējās — 2 atmosfēras, jo motora dēļ priekša ir smagāka. Nepareizs spiediens pasliktina saķeri un bojā riepas. Pārbauda reizi nedēļā.",
        },
        {
          question: "Riteņa maiņa un drošība",
          answer:
            "Izslēdz motoru, velk stāvbremzi un 1. pārnesumu. Ieslēdz avārijas gaismas, uzvelk vesti un noliek avārijas trīsstūri. Zems pretējā riteņa liek ķīļus. Atbrīvo skrūves, paceļ auto ar domkratu, nomaina riteni. Skrūves pievelk pa diagonāli.",
        },
        {
          question: "Dzesēšanas šķidrums",
          answer:
            'Šķidruma līmenim izplešanās tvertnē jābūt starp "MIN" un "MAX". Ja līmenis ir zems, papildina ar tosolu vai antifrīzu. Vāciņu drīkst vērt vaļā tikai tad, kad motors ir atdzisis, lai neapplaucētos.',
        },
        {
          question: "Eļļas līmenis motorā",
          answer:
            'Izvelk eļļas mērstieni, noslauka, ieliek atpakaļ un pārbauda līmeni. Eļļai jābūt starp atzīmēm "MIN" un "MAX". Ja vajag, eļļu pielej pa vāciņu ar eļļas kanniņas simbolu. Eļļu maina ik pēc 15 000 km.',
        },
        {
          question: "Logu mazgātāja šķidrums un tīrītāji",
          answer:
            "Par zemu līmeni brīdina lampiņa panelī. Atver tvertnes vāciņu ar stikla simbolu un pielej šķidrumu. Ziemā izmanto šķidrumu, kas nesasalst. Tīrītājus ieslēdz ar sviru pie stūres.",
        },
        {
          question: "Ārējais apgaismojums",
          answer:
            "Gaismas ieslēdz ar slēdzi salona iekšpusē. Bremžu un atpakaļgaitas gaismas var pārbaudīt, skatoties atspulgā vai lūdzot kādam palīdzēt. Ja pagrieziens mirgo pārāk ātri, lampiņa ir izdegusi.",
        },
        {
          question: "Mēraparātu panelis",
          answer:
            "Spidometrs rāda ātrumu, tahometrs — motora apgriezienus, odometrs — nobraukumu. Zila lampiņa nozīmē tālās gaismas. Dzeltens signāls brīdina par kļūdu. Sarkans signāls nozīmē bīstamu bojājumu, un braukt nedrīkst.",
        },
        {
          question: "Bremžu šķidrums",
          answer:
            'Tvertne atrodas zem motora pārsega pretim bremžu pedālim. Līmenim jābūt starp "MIN" un "MAX". Ja līmenis krītas, pārbauda bremžu kluču nodilumu un papildina šķidrumu.',
        },
        {
          question: "Kruīza kontrole",
          answer:
            "Parastā kruīza kontrole uztur iestatīto ātrumu. Adaptīvā kruīza kontrole pati samazina ātrumu, ja priekšā kāds brauc lēnāk. Tā palīdz atpūtināt kājas, bet var samazināt vadītāja uzmanību.",
        },
        {
          question: "Distances sensori",
          answer:
            "Sensori buferī mēra attālumu līdz šķērslim. Tie raida skaņas signālu, kas kļūst ātrāks, tuvojoties šķērslim. Kad paliek 30 cm, skaņa kļūst nepārtraukta.",
        },
        {
          question: "Sadursmes brīdinājums un automātiskā bremzēšana",
          answer:
            "Sadursmes brīdināšanas sistēma dod skaņas un vizuālu signālu, bet bremzē vadītājs. Automātiskā bremzēšanas sistēma briesmu gadījumā nobremzē pati.",
        },
        {
          question: "Līniju asistents un aklā zona",
          answer:
            "Līniju asistents brīdina, ja auto netīšām brauc pāri ceļa līnijai. Aklās zonas sensori iededz lampiņu spogulī, ja blakus atrodas cits auto.",
        },
        {
          question: "Auto bremzes",
          answer: "Automobilis ir aprīkots ar darba bremzi un stāvbremzi.",
        },
      ];

      let cards = [...flashcardsData];
      let currentIndex = 0;
      let isFlipped = false;

      const card = document.getElementById("card");
      const questionText = document.getElementById("questionText");
      const answerText = document.getElementById("answerText");
      const counter = document.getElementById("counter");
      const cardContainer = document.getElementById("cardContainer");

      function updateCard() {
        card.classList.remove("flipped");
        isFlipped = false;

        setTimeout(() => {
          questionText.textContent = cards[currentIndex].question;
          answerText.textContent = cards[currentIndex].answer;
          counter.textContent = `${currentIndex + 1} / ${cards.length}`;
        }, 150);
      }

      function flipCard() {
        isFlipped = !isFlipped;
        card.classList.toggle("flipped", isFlipped);
      }

      function nextCard() {
        card.classList.add("swipe-left");
        setTimeout(() => {
          currentIndex = (currentIndex + 1) % cards.length;
          updateCard();
          card.classList.remove("swipe-left");
        }, 300);
      }

      function prevCard() {
        card.classList.add("swipe-right");
        setTimeout(() => {
          currentIndex = (currentIndex - 1 + cards.length) % cards.length;
          updateCard();
          card.classList.remove("swipe-right");
        }, 300);
      }

      function shuffleCards() {
        for (let i = cards.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [cards[i], cards[j]] = [cards[j], cards[i]];
        }
        currentIndex = 0;
        updateCard();
      }

      // Event Listeners
      card.addEventListener("click", (e) => {
        // Игнорируем свайп-клики
        if (Math.abs(touchEndX - touchStartX) < 10) {
          flipCard();
        }
      });

      document.getElementById("nextBtn").addEventListener("click", nextCard);
      document.getElementById("prevBtn").addEventListener("click", prevCard);
      document
        .getElementById("shuffleBtn")
        .addEventListener("click", shuffleCards);

      // Touch / Swipe logic
      let touchStartX = 0;
      let touchEndX = 0;

      cardContainer.addEventListener(
        "touchstart",
        (e) => {
          touchStartX = e.changedTouches[0].screenX;
        },
        { passive: true },
      );

      cardContainer.addEventListener(
        "touchend",
        (e) => {
          touchEndX = e.changedTouches[0].screenX;
          handleSwipe();
        },
        { passive: true },
      );

      function handleSwipe() {
        const swipeDistance = touchEndX - touchStartX;
        if (swipeDistance < -50) {
          nextCard();
        } else if (swipeDistance > 50) {
          prevCard();
        }
      }

      // Keyboard navigation for PC
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") nextCard();
        if (e.key === "ArrowLeft") prevCard();
        if (e.key === " " || e.key === "ArrowUp" || e.key === "ArrowDown") {
          e.preventDefault();
          flipCard();
        }
      });

      // Init
      updateCard();
    </script>
  </body>
</html>
